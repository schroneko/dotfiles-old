# プロンプトの一番上の行の前に空行を追加
add_newline = true

# プロンプトのフォーマット
format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$cmd_duration\
$line_break\
$character"""

# キャラクター設定
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

# ディレクトリ設定
[directory]
truncation_length = 5
truncate_to_repo = true
style = "blue"

# Gitブランチ設定
[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "purple"

# Gitステータス設定
[git_status]
format = '[$all_status$ahead_behind]($style)'
style = "red"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
up_to_date = ""
untracked = "+"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# コマンド実行時間
[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "yellow"

# 言語バージョン表示設定
[nodejs]
format = "[$symbol($version )]($style)"
symbol = " "
style = "green"

[python]
format = "[$symbol($version )]($style)"
symbol = " "
style = "yellow"

[rust]
format = "[$symbol($version )]($style)"
symbol = " "
style = "red"
