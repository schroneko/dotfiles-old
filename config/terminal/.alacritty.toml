# 基本設定
[general]
live_config_reload = true

[env]
TERM = "alacritty"

# ウィンドウ設定
[window]
opacity = 1.0
startup_mode = "Maximized"
decorations = "Buttonless"
dynamic_padding = true
blur = true

[window.padding]
x = 8
y = 8

# フォント設定
[font]
size = 20.0

[font.normal]
family = "PlemolJP Console NF"
style = "Regular"

[font.bold]
family = "PlemolJP Console NF"
style = "Bold"

[font.italic]
family = "PlemolJP Console NF"
style = "Italic"

[font.bold_italic]
family = "PlemolJP Console NF"
style = "Bold Italic"

# カラースキーム（Tokyo Night）
[colors.primary]
background = "0x1a1b26"
foreground = "0xc0caf5"

[colors.normal]
black = "0x15161E"
red = "0xf7768e"
green = "0x9ece6a"
yellow = "0xe0af68"
blue = "0x7aa2f7"
magenta = "0xbb9af7"
cyan = "0x7dcfff"
white = "0xa9b1d6"

[colors.bright]
black = "0x414868"
red = "0xf7768e"
green = "0x9ece6a"
yellow = "0xe0af68"
blue = "0x7aa2f7"
magenta = "0xbb9af7"
cyan = "0x7dcfff"
white = "0xc0caf5"
